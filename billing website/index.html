<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMY Restaurant - Menu</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">PMY Restaurant</h1>
            <button class="menu-toggle" id="menuToggle">☰</button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="active">Menu</a></li>
                <li><a href="manage-menu.html">Manage Menu</a></li>
                <li><a href="cart.html">Cart <span id="cartCount" class="cart-badge">0</span></a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <h2 class="page-title">Our Menu</h2>
        <div class="menu-grid" id="menuGrid">
            <!-- Menu items will be dynamically loaded here -->
        </div>

        <!-- Payment QR Code Section Below Menu -->
        <div class="payment-section-below-menu">
            <h2 class="page-title" style="margin-top: 3rem;">Scan to Pay</h2>
            <div class="payment-qr-container">
                <div class="payment-qr-display">
                    <img id="paymentQRBelowMenu" src="" alt="Payment QR Code" style="max-width: 300px; width: 100%; height: auto; border: 2px solid #ddd; border-radius: 8px; padding: 15px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: none;">
                    <p id="qrMessageBelowMenu" style="color: #7f8c8d; margin-top: 15px; font-size: 1rem;">Set QR code in Manage Menu</p>
                </div>
                <div class="payment-options">
                    <button class="btn btn-primary" onclick="window.location.href='invoice.html'" id="viewInvoiceBtn" style="display: none;">View Invoice</button>
                    <button class="btn btn-secondary" id="scanCustomerQRBelowMenu">Scan Customer QR</button>
                </div>
            </div>
        </div>

        <!-- Cart Section -->
        <div class="cart-section" id="cartSection">
            <h2 class="page-title">Your Cart</h2>
            <div class="cart-container-inline">
                <div class="cart-items-inline" id="cartItemsInline">
                    <!-- Cart items will be dynamically loaded here -->
                </div>
                
                <div class="cart-summary-inline">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotalInline">₹0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="totalInline">₹0.00</span>
                    </div>
                    <!-- Payment QR Code Section -->
                    <div class="payment-qr-section-small" style="margin-bottom: 1rem;">
                        <h4 style="margin-bottom: 0.5rem; color: var(--primary-color);">Scan to Pay</h4>
                        <div class="qr-code-display-small" id="paymentQRCodeInline">
                            <img id="paymentQRImageInline" src="" alt="Payment QR Code" style="max-width: 180px; width: 100%; height: auto; border: 2px solid #ddd; border-radius: 8px; padding: 8px; background: white; display: none;">
                            <p style="color: #7f8c8d; margin-top: 8px; font-size: 0.85rem; text-align: center;" id="qrCodeMessageInline">Set QR code in Manage Menu</p>
                        </div>
                    </div>
                    
                    <div class="cart-actions-inline">
                        <button class="btn btn-primary" id="proceedToInvoiceBtn">Proceed to Invoice</button>
                        <button class="btn btn-secondary" id="openQRScannerInline">Scan Customer QR</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- QR Scanner Modal -->
    <div id="qrModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Scan QR Code</h3>
            <div id="qr-reader"></div>
            <div id="qr-result"></div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="script.js"></script>
    <script src="cart-inline.js"></script>
    <script src="qr-scanner.js"></script>
    <script src="qr-payment.js"></script>
    <script>
        // Setup scan customer QR button below menu
        document.addEventListener('DOMContentLoaded', () => {
            const scanBtn = document.getElementById('scanCustomerQRBelowMenu');
            if (scanBtn && typeof openQRScanner === 'function') {
                scanBtn.addEventListener('click', () => {
                    openQRScanner();
                });
            }
        });
    </script>
</body>
</html>
