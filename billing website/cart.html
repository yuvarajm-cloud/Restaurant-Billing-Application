<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMY Restaurant - Cart</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">PMY Restaurant</h1>
            <button class="menu-toggle" id="menuToggle">☰</button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html">Menu</a></li>
                <li><a href="manage-menu.html">Manage Menu</a></li>
                <li><a href="cart.html" class="active">Cart <span id="cartCount" class="cart-badge">0</span></a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <h2 class="page-title">Shopping Cart</h2>
        
        <div class="cart-container">
            <div class="cart-items" id="cartItems">
                <!-- Cart items will be dynamically loaded here -->
            </div>
            
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">₹0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">₹0.00</span>
                </div>
                
                <!-- Payment QR Code Section -->
                <div class="payment-qr-section-small">
                    <h4>Scan to Pay</h4>
                    <div class="qr-code-display-small" id="paymentQRCodeCart">
                        <img id="paymentQRImageCart" src="" alt="Payment QR Code" style="max-width: 200px; width: 100%; height: auto; border: 2px solid #ddd; border-radius: 8px; padding: 8px; background: white;">
                        <p style="color: #7f8c8d; margin-top: 8px; font-size: 0.85rem; text-align: center;" id="qrCodeMessageCart">Set QR code in Manage Menu</p>
                    </div>
                </div>
                
                <div class="cart-actions">
                    <button class="btn btn-primary" id="proceedToInvoice">Proceed to Invoice</button>
                    <button class="btn btn-secondary" id="openQRScanner">Scan Customer QR</button>
                </div>
            </div>
        </div>
    </main>

    <!-- QR Scanner Modal -->
    <div id="qrModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Scan QR Code</h3>
            <div id="qr-reader"></div>
            <div id="qr-result"></div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="script.js"></script>
    <script src="cart.js"></script>
    <script src="qr-scanner.js"></script>
    <script src="qr-payment.js"></script>
</body>
</html>
